
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyLife OS">
<title>MyLife OS V2</title>

<style>
:root {
 --bg:#f2f2f7;
 --card:#ffffff;
 --tx:#1c1c1e;
 --mu:#8e8e93;
 --ac:#0a84ff;
 --ok:#30c779;
 --bad:#ff453a;
 --wa:#ff9f0a;
 --ln:#e5e5ea;
 --shadow:0 3px 14px rgba(0,0,0,.045);
 color-scheme:light;
}

:root[data-theme="dark"] {
 --bg:#000;
 --card:#1c1c1e;
 --tx:#f2f2f7;
 --mu:#98989d;
 --ln:#333336;
 --shadow:none;
 color-scheme:dark;
}

* {
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

body {
 margin:0;
 background:var(--bg);
 color:var(--tx);
 font:15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
 padding-top:env(safe-area-inset-top);
 padding-bottom:env(safe-area-inset-bottom);
}

button,input,select,textarea {
 font:inherit;
}

button {
 cursor:pointer;
 touch-action:manipulation;
}

#main {
 max-width:720px;
 margin:auto;
 padding:26px 16px 115px;
 min-height:100vh;
 animation:appear .2s ease;
}

@keyframes appear {
 from {opacity:0;transform:translateY(5px)}
 to {opacity:1;transform:translateY(0)}
}

h1 {
 font-size:30px;
 margin:8px 0 3px;
 letter-spacing:-.7px;
}

h2 {
 font-size:18px;
 margin:24px 0 10px;
}

h3 {margin:0 0 10px}

.mu {color:var(--mu);font-size:13px}

.card {
 background:var(--card);
 border-radius:19px;
 padding:16px;
 margin:11px 0;
 box-shadow:var(--shadow);
 min-width:0;
}

.grid {
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;
}

.grid .card {margin:0}

.big {
 font-size:25px;
 font-weight:750;
 letter-spacing:-.7px;
}

.row {
 display:flex;
 align-items:center;
 gap:10px;
 padding:12px 0;
 border-bottom:1px solid var(--ln);
 min-width:0;
}

.row:last-child {border-bottom:0}

.row .content {
 flex:1;
 min-width:0;
 overflow-wrap:anywhere;
}

.row button {flex-shrink:0}

.bar {
 height:8px;
 background:var(--ln);
 border-radius:20px;
 overflow:hidden;
 margin-top:9px;
}

.bar i {
 display:block;
 height:100%;
 background:var(--ac);
 border-radius:20px;
 transition:width .3s;
}

.btn {
 display:block;
 width:100%;
 padding:14px;
 border:0;
 border-radius:14px;
 background:var(--ac);
 color:white;
 font-weight:700;
 min-height:49px;
 margin-top:12px;
}

.btn.secondary {
 background:var(--ln);
 color:var(--tx);
}

.btn.danger {
 background:#ffe5e3;
 color:#d92d20;
}

.small-btn {
 border:0;
 background:var(--ln);
 color:var(--tx);
 border-radius:11px;
 padding:9px 12px;
 min-height:39px;
 font-size:13px;
 font-weight:650;
}

.small-btn.blue {
 background:#e4f1ff;
 color:#0877db;
}

.small-btn.red {
 background:#ffe5e3;
 color:#d92d20;
}

.chk {
 width:27px;
 height:27px;
 border:2px solid var(--mu);
 border-radius:50%;
 background:none;
 flex-shrink:0;
 color:white;
}

.chk.done {
 background:var(--ok);
 border-color:var(--ok);
}

.done .task-title {
 text-decoration:line-through;
 color:var(--mu);
}

.tag {
 display:inline-block;
 padding:3px 8px;
 border-radius:8px;
 background:var(--ln);
 font-size:11px;
}

nav {
 position:fixed;
 z-index:30;
 bottom:0;
 left:0;
 right:0;
 display:flex;
 justify-content:space-around;
 background:color-mix(in srgb,var(--card) 93%,transparent);
 backdrop-filter:blur(20px);
 border-top:1px solid var(--ln);
 padding:7px 0 calc(8px + env(safe-area-inset-bottom));
}

nav button {
 flex:1;
 border:0;
 background:none;
 color:var(--mu);
 font-size:11px;
 min-height:52px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:3px;
}

nav button span {font-size:21px}
nav button.active {color:var(--ac)}

input,select,textarea {
 width:100%;
 padding:12px;
 border-radius:12px;
 border:1px solid var(--ln);
 background:var(--bg);
 color:var(--tx);
 min-height:45px;
 margin-top:5px;
 outline:none;
}

input:focus,select:focus,textarea:focus {
 border-color:var(--ac);
 box-shadow:0 0 0 2px rgba(10,132,255,.12);
}

label {
 display:block;
 font-size:13px;
 color:var(--mu);
 margin-top:14px;
}

.setting-row {
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 padding:14px 0;
 border-bottom:1px solid var(--ln);
}

.setting-row:last-child {border:0}

.setting-input {
 max-width:145px;
 text-align:right;
 font-weight:700;
 margin:0;
}

#modal {
 display:none;
 position:fixed;
 inset:0;
 z-index:100;
 background:rgba(0,0,0,.48);
 align-items:flex-end;
}

#modal.show {display:flex}

.modal-box {
 background:var(--card);
 color:var(--tx);
 width:100%;
 max-width:720px;
 margin:auto;
 border-radius:24px 24px 0 0;
 padding:22px 19px calc(25px + env(safe-area-inset-bottom));
 max-height:90dvh;
 overflow-y:auto;
 overscroll-behavior:contain;
}

.modal-head {
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.modal-close {
 border:0;
 background:var(--ln);
 border-radius:50%;
 width:35px;
 height:35px;
 color:var(--tx);
}

.quick {
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
}

.quick button {
 background:var(--card);
 color:var(--tx);
 border:0;
 border-radius:16px;
 padding:13px 5px;
 box-shadow:var(--shadow);
 font-size:12px;
}

.quick span {
 display:block;
 font-size:23px;
 margin-bottom:4px;
}

.segment {
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding:5px 0 10px;
}

.segment button {
 white-space:nowrap;
 border:0;
 background:var(--card);
 color:var(--tx);
 border-radius:20px;
 padding:8px 13px;
}

.segment button.active {
 background:var(--ac);
 color:white;
}

.recipe-grid {
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;
}

.recipe {
 background:var(--card);
 border-radius:16px;
 overflow:hidden;
 box-shadow:var(--shadow);
}

.recipe img,.recipe-placeholder {
 width:100%;
 height:120px;
 object-fit:cover;
 background:var(--ln);
}

.recipe-placeholder {
 display:grid;
 place-items:center;
 font-size:35px;
}

.recipe-info {padding:11px}

.empty {
 text-align:center;
 padding:25px;
 color:var(--mu);
 background:var(--card);
 border-radius:17px;
 margin:12px 0;
}

.warn {
 background:#fff0d6;
 color:#925400;
 padding:12px;
 border-radius:13px;
 margin:12px 0;
}

@media(min-width:850px) {
 body {padding-left:190px}
 nav {
  top:0;
  bottom:0;
  right:auto;
  width:190px;
  flex-direction:column;
  justify-content:flex-start;
  padding:35px 10px;
  border-right:1px solid var(--ln);
 }
 nav button {
  flex:none;
  flex-direction:row;
  justify-content:flex-start;
  gap:12px;
  padding:12px;
  font-size:14px;
 }
}
</style>
</head>

<body>

<div id="main"></div>
<nav id="nav"></nav>
<div id="modal"></div>

<script>
'use strict';

/* =========================
   STORAGE & INITIAL DATA
========================= */

const KEY='mylife_os_v1';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const today=()=>{
 const p=new Intl.DateTimeFormat('en-CA',{
  timeZone:'Asia/Kuala_Lumpur',
  year:'numeric',month:'2-digit',day:'2-digit'
 }).formatToParts(new Date());
 const o={};
 p.forEach(x=>o[x.type]=x.value);
 return `${o.year}-${o.month}-${o.day}`;
};

const defaults={
 tasks:[],
 exp:[],
 food:[],
 rec:[],
 shop:[],
 hab:[
  'Drink enough water',
  'Exercise',
  'Walk',
  'Sleep on time',
  'Read',
  'Complete daily priorities'
 ],
 hlog:{},
 set:{
  inc:0,
  bud:0,
  cal:2000,
  theme:'auto'
 }
};

let S={};

try {
 S=JSON.parse(localStorage.getItem(KEY))||{};
} catch(e) {S={};}

Object.keys(defaults).forEach(k=>{
 if(S[k]===undefined) {
  S[k]=structuredClone(defaults[k]);
 }
});

S.set={...defaults.set,...(S.set||{})};
S.hlog=S.hlog||{};

function save(){
 try {
  localStorage.setItem(KEY,JSON.stringify(S));
  return true;
 } catch(e) {
  alert('Storage penuh. Export backup dan cuba lagi.');
  return false;
 }
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;',
 '"':'&quot;',"'":'&#39;'
}[c]));

const rm=n=>'RM '+(Number(n)||0).toFixed(2);
const fd=d=>d?d.split('-').reverse().join('/'):'';
const sum=(a,k)=>a.reduce((v,x)=>v+(Number(x[k])||0),0);

const addDays=(d,n)=>{
 const x=new Date(d+'T00:00:00Z');
 x.setUTCDate(x.getUTCDate()+n);
 return x.toISOString().slice(0,10);
};

const month=()=>today().slice(0,7);

let tab='home';
let filter='All';
let search='';

if(S.set.theme!=='auto') {
 document.documentElement.dataset.theme=S.set.theme;
}

/* =========================
   MODAL SYSTEM
========================= */

function closeModal(){
 $('#modal').classList.remove('show');
 $('#modal').innerHTML='';
}

function openModal(title,fields,onSave){
 const m=$('#modal');

 m.innerHTML=`
 <div class="modal-box">
  <div class="modal-head">
   <h3>${esc(title)}</h3>
   <button class="modal-close" id="closeModal">✕</button>
  </div>
  <form id="editForm">
   ${fields.map(f=>`
    <label>${esc(f.label)}
     ${f.type==='textarea'
      ?`<textarea name="${f.key}" rows="4">${esc(f.value??'')}</textarea>`
      :f.type==='select'
      ?`<select name="${f.key}">
       ${f.options.map(o=>`<option value="${esc(o)}" ${o===f.value?'selected':''}>${esc(o)}</option>`).join('')}
       </select>`
      :`<input name="${f.key}" type="${f.type||'text'}"
       value="${esc(f.value??'')}"
       ${f.type==='number'?'step="any" inputmode="decimal"':''}
       ${f.required?'required':''}>`
     }
    </label>
   `).join('')}
   <button class="btn" type="submit">Save changes</button>
   <button class="btn secondary" type="button" id="cancelModal">Cancel</button>
  </form>
 </div>`;

 m.classList.add('show');

 $('#closeModal').onclick=closeModal;
 $('#cancelModal').onclick=closeModal;

 m.onclick=e=>{
  if(e.target===m)closeModal();
 };

 $('#editForm').onsubmit=e=>{
  e.preventDefault();

  const data=Object.fromEntries(new FormData(e.target));
  for(const f of fields){
   if(f.required&&!String(data[f.key]||'').trim()){
    alert(f.label+' is required.');
    return;
   }
   if(f.type==='number'&&data[f.key]!==''&&
    (!Number.isFinite(Number(data[f.key]))||Number(data[f.key])<0)){
    alert('Please enter a valid number.');
    return;
   }
  }

  onSave(data);
  save();
  closeModal();
  render();
 };
}

/* =========================
   COMMON ACTIONS
========================= */

function removeItem(collection,id){
 if(!confirm('Delete this item?'))return;
 S[collection]=S[collection].filter(x=>x.id!==id);
 save();
 render();
}

function toggle(collection,id,key){
 const item=S[collection].find(x=>x.id===id);
 if(!item)return;
 item[key]=!item[key];
 save();
 render();
}

function empty(icon,message){
 return `<div class="empty"><div style="font-size:35px">${icon}</div>${message}</div>`;
}

function progress(v,max){
 const pct=max?Math.min(100,v/max*100):0;
 return `<div class="bar"><i style="width:${pct}%"></i></div>`;
}

/* =========================
   PLANNER
========================= */

function taskForm(id=null){
 const r=S.tasks.find(x=>x.id===id)||{};

 openModal(id?'Edit task':'New task',[
  {key:'title',label:'Task title',value:r.title,required:true},
  {key:'note',label:'Description',value:r.note},
  {key:'due',label:'Due date',type:'date',value:r.due||today()},
  {key:'time',label:'Time',type:'time',value:r.time},
  {key:'pri',label:'Priority',type:'select',options:['High','Medium','Low'],value:r.pri||'Medium'},
  {key:'tag',label:'Category',value:r.tag},
  {key:'rep',label:'Repeat',type:'select',options:['None','Daily','Weekly','Monthly'],value:r.rep||'None'}
 ],v=>{
  if(id)Object.assign(r,v);
  else S.tasks.push({id:uid(),...v,done:false});
 });
}

function toggleTask(id){
 const t=S.tasks.find(x=>x.id===id);
 if(!t)return;

 if(!t.done&&t.rep&&t.rep!=='None'){
  const d=t.due||today();
  t.due=t.rep==='Daily'?addDays(d,1):
   t.rep==='Weekly'?addDays(d,7):
   addDays(d,30);
 } else {
  t.done=!t.done;
 }
 save();
 render();
}

function taskHTML(t){
 return `<div class="row ${t.done?'done':''}">
 <button class="chk ${t.done?'done':''}" data-action="task-toggle" data-id="${t.id}">${t.done?'✓':''}</button>
 <div class="content">
  <div class="task-title"><b>${esc(t.title)}</b></div>
  <div class="mu">${fd(t.due)} ${esc(t.time||'')} · ${esc(t.pri||'Medium')} ${t.tag?'· '+esc(t.tag):''}</div>
  ${t.note?`<div class="mu">${esc(t.note)}</div>`:''}
 </div>
 <button class="small-btn blue" data-action="task-edit" data-id="${t.id}">Edit</button>
 <button class="small-btn red" data-action="task-delete" data-id="${t.id}">✕</button>
 </div>`;
}

function planner(){
 const d=today();
 const active=S.tasks.filter(t=>!t.done);
 const overdue=active.filter(t=>t.due&&t.due<d);
 const current=active.filter(t=>t.due===d);
 const upcoming=active.filter(t=>!t.due||t.due>d);
 const completed=S.tasks.filter(t=>t.done);

 const section=(title,arr)=>`
 <h2>${title}</h2>
 <div class="card">${arr.length?arr.map(taskHTML).join(''):`
 <div class="mu">Nothing here.</div>`}</div>`;

 return `
 <h1>Planner</h1>
 <div class="mu">Organise your day, one task at a time.</div>
 <button class="btn" data-action="task-add">＋ Add new task</button>
 ${section('🔴 Overdue',overdue)}
 ${section('📅 Today',current)}
 ${section('⏭ Upcoming',upcoming)}
 ${section('✓ Completed',completed)}
 `;
}

/* =========================
   FINANCE
========================= */

const CATS=[
 'Food & Drinks','Groceries','Transportation',
 'Shopping','Household','Utilities & Bills',
 'Healthcare','Entertainment','Family','Others'
];

const PAY=['Cash','Debit Card','Credit Card','Online Banking','E-wallet'];

function expenseForm(id=null){
 const r=S.exp.find(x=>x.id===id)||{};

 openModal(id?'Edit expense':'New expense',[
  {key:'amt',label:'Amount (RM)',type:'number',value:r.amt,required:true},
  {key:'desc',label:'Description',value:r.desc},
  {key:'date',label:'Date',type:'date',value:r.date||today()},
  {key:'cat',label:'Category',type:'select',options:CATS,value:r.cat||CATS[0]},
  {key:'pay',label:'Payment method',type:'select',options:PAY,value:r.pay||PAY[0]},
  {key:'note',label:'Notes',value:r.note}
 ],v=>{
  if(id)Object.assign(r,v);
  else S.exp.push({id:uid(),...v});
 });
}

function finance(){
 const ex=S.exp.filter(e=>e.date?.startsWith(month()));
 const total=sum(ex,'amt');
 const balance=(Number(S.set.inc)||0)-total;
 const budget=Number(S.set.bud)||0;
 const cats={};

 ex.forEach(e=>cats[e.cat]=(cats[e.cat]||0)+Number(e.amt));

 return `
 <h1>Finance</h1>
 <div class="mu">Your monthly financial overview</div>
 <button class="btn" data-action="expense-add">＋ Add expense</button>

 ${budget&&total>=budget*.8?`
 <div class="warn">${total>=budget?'⚠ Budget exceeded':'⚠ You are approaching your budget.'}</div>`:''}

 <div class="grid" style="margin-top:13px">
  <div class="card"><div class="mu">Income</div><div class="big">${rm(S.set.inc)}</div></div>
  <div class="card"><div class="mu">Expenses</div><div class="big">${rm(total)}</div></div>
  <div class="card"><div class="mu">Balance</div><div class="big">${rm(balance)}</div></div>
  <div class="card"><div class="mu">Budget remaining</div><div class="big">${budget?rm(budget-total):'—'}</div></div>
 </div>

 <h2>Monthly budget</h2>
 <div class="card">
  <div style="display:flex;justify-content:space-between">
   <span class="mu">Spent</span><b>${rm(total)}</b>
  </div>
  ${progress(total,budget)}
  <div class="mu" style="margin-top:7px">${budget?Math.round(total/budget*100)+'% used':'Set a budget in Settings.'}</div>
 </div>

 <h2>Spending by category</h2>
 <div class="card">
 ${Object.keys(cats).length?
 Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
 <div style="margin:12px 0">
 <div style="display:flex;justify-content:space-between">
 <span>${esc(k)}</span><b>${rm(v)}</b></div>
 ${progress(v,total)}
 </div>`).join(''):'<div class="mu">No expenses recorded.</div>'}
 </div>

 <h2>Transactions</h2>
 <div class="card">
 ${[...S.exp].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`
 <div class="row">
 <div class="content">
  <b>${esc(e.desc||e.cat)}</b>
  <div class="mu">${fd(e.date)} · ${esc(e.cat)} · ${esc(e.pay)}</div>
 </div>
 <b>${rm(e.amt)}</b>
 <button class="small-btn blue" data-action="expense-edit" data-id="${e.id}">Edit</button>
 <button class="small-btn red" data-action="expense-delete" data-id="${e.id}">✕</button>
 </div>`).join('')||'<div class="mu">No transactions yet.</div>'}
 </div>`;
}

/* =========================
   HEALTH & FOOD
========================= */

const MEALS=['Breakfast','Lunch','Dinner','Snacks'];

function foodForm(id=null){
 const r=S.food.find(x=>x.id===id)||{};

 openModal(id?'Edit food log':'Log food',[
  {key:'meal',label:'Meal',type:'select',options:MEALS,value:r.meal||MEALS[0]},
  {key:'name',label:'Food name',value:r.name,required:true},
  {key:'qty',label:'Quantity / serving',value:r.qty},
  {key:'kcal',label:'Calories (kcal)',type:'number',value:r.kcal,required:true},
  {key:'p',label:'Protein (g)',type:'number',value:r.p||0},
  {key:'c',label:'Carbs (g)',type:'number',value:r.c||0},
  {key:'f',label:'Fat (g)',type:'number',value:r.f||0}
 ],v=>{
  if(id)Object.assign(r,v);
  else S.food.push({id:uid(),date:today(),...v});
 });
}

function health(){
 const foods=S.food.filter(x=>x.date===today());
 const kcal=sum(foods,'kcal');
 const target=Number(S.set.cal)||2000;

 return `
 <h1>Health</h1>
 <div class="mu">Daily nutrition tracker</div>

 <div class="card">
  <div class="mu">Calories consumed</div>
  <div class="big">${kcal} <span class="mu">/ ${target} kcal</span></div>
  ${progress(kcal,target)}
  <div class="mu" style="margin-top:9px">${Math.max(0,target-kcal)} kcal remaining</div>
  <div class="grid" style="margin-top:16px">
   <div><div class="mu">Protein</div><b>${sum(foods,'p')} g</b></div>
   <div><div class="mu">Carbs</div><b>${sum(foods,'c')} g</b></div>
   <div><div class="mu">Fat</div><b>${sum(foods,'f')} g</b></div>
  </div>
 </div>

 <button class="btn" data-action="food-add">＋ Log food</button>

 ${MEALS.map(m=>{
  const a=foods.filter(x=>x.meal===m);
  return `
  <h2>${m} · ${sum(a,'kcal')} kcal</h2>
  <div class="card">
  ${a.map(x=>`
   <div class="row">
    <div class="content">
     <b>${esc(x.name)}</b>
     <div class="mu">${esc(x.qty||'')} · P ${x.p||0}g · C ${x.c||0}g · F ${x.f||0}g</div>
    </div>
    <b>${x.kcal}</b>
    <button class="small-btn blue" data-action="food-edit" data-id="${x.id}">Edit</button>
    <button class="small-btn red" data-action="food-delete" data-id="${x.id}">✕</button>
   </div>`).join('')||'<div class="mu">Nothing logged.</div>'}
  </div>`;
 }).join('')}

 <div class="card mu">Nutrition values are estimates. Photo-based food recognition is not enabled in this version.</div>
 `;
}

/* =========================
   HABITS - FULL EDIT SYSTEM
========================= */

function habitForm(index=null){
 const editing=index!==null;
 const old=editing?S.hab[index]:'';

 openModal(editing?'Edit habit':'Create new habit',[
  {key:'name',label:'Habit name',value:old,required:true}
 ],v=>{
  if(editing){
   S.hab[index]=v.name;

function habitToggle(i){

function habitStreak(i){
 let d=today(),n=0;
 if(!(S.hlog[d]||[]).includes(i))d=addDays(d,-1);

 while((S.hlog[d]||[]).includes(i)&&n<1000){
  n++;
  d=addDays(d,-1);
 }
 return n;
}

function imageFile(file){
 return new Promise(resolve=>{
  if(!file){resolve('');return;}
  const img=new Image();
  const url=URL.createObjectURL(file);

  img.onload=()=>{
   const scale=Math.min(1,700/img.width);
   const c=document.createElement('canvas');
   c.width=img.width*scale;
   c.height=img.height*scale;
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   resolve(c.toDataURL('image/jpeg',.72));
   URL.revokeObjectURL(url);
  };
  img.onerror=()=>{resolve('');URL.revokeObjectURL(url)};
  img.src=url;
 });
}

/* =========================
   BACKUP & EXPORT
========================= */

function download(name,data,type){
 const blob=new Blob([data],{type});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download=name;
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function importBackup(){
 const input=document.createElement('input');
 input.type='file';
 input.accept='.json,application/json';

 input.onchange=async()=>{
  if(!input.files[0])return;

  try{
   const data=JSON.parse(await input.files[0].text());

   if(!data||!Array.isArray(data.tasks)||
    !Array.isArray(data.hab)||!data.set){
    throw new Error('Invalid backup');
   }

   if(!confirm('Importing will replace current app data. Continue?'))return;

   S=data;
   S.set={...defaults.set,...(S.set||{})};
   S.hlog=S.hlog||{};

   save();
   go('home');
   alert('Backup imported successfully!');
  }catch(e){
   alert('Invalid backup file.');
  }
 };

 input.click();
}
