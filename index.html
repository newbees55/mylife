
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyLife OS">
<title>MyLife OS</title>

<style>
:root {
 --bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--mu:#8e8e93;
 --ac:#0a84ff;--ok:#30c779;--bad:#ff453a;--wa:#ff9f0a;
 --ln:#e5e5ea;--shadow:0 3px 14px rgba(0,0,0,.045);
 color-scheme:light;
}
:root[data-theme="dark"] {
 --bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mu:#98989d;
 --ln:#333336;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
#main{max-width:760px;margin:auto;padding:24px 16px 115px;min-height:100vh;animation:appear .2s ease}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:30px;margin:8px 0 3px;letter-spacing:-.7px}
h2{font-size:18px;margin:24px 0 10px}
h3{margin:0 0 10px}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border-radius:19px;padding:16px;margin:11px 0;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid .card{margin:0}
.big{font-size:25px;font-weight:750;letter-spacing:-.7px}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln);min-width:0}
.row:last-child{border-bottom:0}
.row .content{flex:1;min-width:0;overflow-wrap:anywhere}
.row button{flex-shrink:0}
.bar{height:8px;background:var(--ln);border-radius:20px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:20px;transition:width .3s}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:white;font-weight:700;min-height:49px;margin-top:12px}
.btn.secondary{background:var(--ln);color:var(--tx)}
.btn.danger{background:#ffe5e3;color:#d92d20}
.small-btn{border:0;background:var(--ln);color:var(--tx);border-radius:11px;padding:9px 11px;min-height:38px;font-size:12px;font-weight:650}
.small-btn.blue{background:#e4f1ff;color:#0877db}
.small-btn.red{background:#ffe5e3;color:#d92d20}
.chk{width:27px;height:27px;border:2px solid var(--mu);border-radius:50%;background:none;flex-shrink:0;color:white}
.chk.done{background:var(--ok);border-color:var(--ok)}
.done .task-title{text-decoration:line-through;color:var(--mu)}
.tag{display:inline-block;padding:3px 8px;border-radius:8px;background:var(--ln);font-size:11px}
nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--ln);padding:7px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button span{font-size:21px}
nav button.active{color:var(--ac)}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);min-height:45px;margin-top:5px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 2px rgba(10,132,255,.12)}
label{display:block;font-size:13px;color:var(--mu);margin-top:14px}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}
.setting-row:last-child{border:0}
.setting-input{max-width:145px;text-align:right;font-weight:700;margin:0}
#modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.48);align-items:flex-end}
#modal.show{display:flex}
.modal-box{background:var(--card);color:var(--tx);width:100%;max-width:760px;margin:auto;border-radius:24px 24px 0 0;padding:22px 19px calc(25px + env(safe-area-inset-bottom));max-height:90dvh;overflow-y:auto;overscroll-behavior:contain}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.modal-close{border:0;background:var(--ln);border-radius:50%;width:38px;height:38px;color:var(--tx)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.quick button{background:var(--card);color:var(--tx);border:0;border-radius:16px;padding:13px 5px;box-shadow:var(--shadow);font-size:12px}
.quick span{display:block;font-size:23px;margin-bottom:4px}
.segment{display:flex;gap:7px;overflow-x:auto;padding:5px 0 10px}
.segment button{white-space:nowrap;border:0;background:var(--card);color:var(--tx);border-radius:20px;padding:8px 13px}
.segment button.active{background:var(--ac);color:white}
.recipe-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.recipe{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.recipe img,.recipe-placeholder{width:100%;height:120px;object-fit:cover;background:var(--ln)}
.recipe-placeholder{display:grid;place-items:center;font-size:35px}
.recipe-info{padding:11px}
.empty{text-align:center;padding:25px;color:var(--mu);background:var(--card);border-radius:17px;margin:12px 0}
.warn{background:#fff0d6;color:#925400;padding:12px;border-radius:13px;margin:12px 0}

/* FINANCE */
.finance-hero{background:linear-gradient(135deg,#173b30,#28654c);color:white;border-radius:23px;padding:21px;position:relative;overflow:hidden;margin:15px 0}
.finance-hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:#ffffff0c;right:-65px;top:-70px}
.finance-hero .mu{color:#c1d7ca}
.finance-balance{font-size:34px;font-weight:850;letter-spacing:-1px;margin:7px 0 20px}
.finance-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.finance-stat{background:#ffffff15;border:1px solid #ffffff13;padding:12px;border-radius:14px}
.finance-stat small{display:block;color:#c1d7ca;font-size:11px;margin-bottom:5px}
.finance-stat strong{font-size:16px}
.finance-month{width:auto;max-width:175px;margin:0;font-size:13px;padding:10px}
.finance-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}
.finance-heading h2{margin:24px 0 10px}
.finance-actions{display:flex;gap:8px}
.finance-actions button{border:0;background:var(--ln);color:var(--tx);padding:9px 11px;border-radius:11px;font-size:12px;font-weight:700}
.finance-budget-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.finance-budget-number{font-size:22px;font-weight:800}
.finance-progress{height:10px;background:var(--ln);border-radius:20px;overflow:hidden;margin:12px 0 9px}
.finance-progress span{display:block;height:100%;border-radius:20px;background:#269b70;transition:width .3s}
.finance-cat{margin:14px 0}
.finance-cat-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:7px}
.finance-cat-track{height:7px;background:var(--ln);border-radius:20px;overflow:hidden}
.finance-cat-track span{display:block;height:100%;border-radius:20px}
.finance-chart{height:130px;display:flex;align-items:end;justify-content:space-around;gap:9px;padding-top:12px}
.finance-bar-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:7px;flex:1;min-width:0}
.finance-bar{width:min(28px,70%);min-height:3px;background:#77b99a;border-radius:7px 7px 3px 3px}
.finance-bar.current{background:#246e4d}
.finance-bar-wrap small{font-size:10px;color:var(--mu)}
.finance-tx{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}
.finance-tx:last-child{border:0}
.finance-tx-icon{width:41px;height:41px;flex-shrink:0;border-radius:13px;background:var(--ln);display:grid;place-items:center;font-size:18px}
.finance-tx-info{flex:1;min-width:0}
.finance-tx-info strong{font-size:13px;display:block;overflow-wrap:anywhere}
.finance-tx-info small{font-size:11px;color:var(--mu)}
.finance-tx-right{text-align:right;min-width:100px}
.finance-tx-amount{font-size:13px;font-weight:750;white-space:nowrap}
.finance-tx-actions{display:flex;gap:4px;justify-content:flex-end;margin-top:5px}
.finance-tx-actions button{border:0;background:transparent;color:var(--mu);font-size:11px;padding:4px}
.finance-add{width:100%;border:0;border-radius:15px;background:#246e4d;color:white;padding:15px;font-weight:800;font-size:14px;margin:13px 0}
.finance-search{margin:5px 0 10px}
.finance-empty{text-align:center;padding:24px 10px;color:var(--mu);font-size:13px}
.finance-pill{display:inline-block;padding:4px 8px;border-radius:8px;background:var(--ln);font-size:10px;color:var(--mu)}
@media(min-width:850px){
 body{padding-left:190px}
 nav{top:0;bottom:0;right:auto;width:190px;flex-direction:column;justify-content:flex-start;padding:35px 10px;border-right:1px solid var(--ln)}
 nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px;font-size:14px}
}
@media(max-width:380px){.finance-tx-right{min-width:85px}.finance-tx-amount{font-size:12px}.finance-month{max-width:145px}}
</style>
</head>
<body>
<div id="main"></div>
<nav id="nav"></nav>
<div id="modal"></div>

<script>
'use strict';

/* STORAGE */
const KEY='mylife_os_v1';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{
 const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kuala_Lumpur',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const o={};p.forEach(x=>o[x.type]=x.value);
 return `${o.year}-${o.month}-${o.day}`;
};
const defaults={
 tasks:[],exp:[],food:[],rec:[],shop:[],
 hab:[],hlog:{},set:{inc:0,bud:0,cal:2000,theme:'auto'}
};
let S={};
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
Object.keys(defaults).forEach(k=>{if(S[k]===undefined)S[k]=structuredClone(defaults[k])});
S.set={...defaults.set,...(S.set||{})};
S.hlog=S.hlog||{};
S.tasks=Array.isArray(S.tasks)?S.tasks:[];
S.exp=Array.isArray(S.exp)?S.exp:[];
S.food=Array.isArray(S.food)?S.food:[];
S.rec=Array.isArray(S.rec)?S.rec:[];
S.shop=Array.isArray(S.shop)?S.shop:[];
S.hab=Array.isArray(S.hab)?S.hab:[];

/* MIGRATE OLD HABITS TO STABLE IDS */
S.hab=S.hab.map(h=>typeof h==='string'?{id:uid(),name:h}:h);
Object.keys(S.hlog).forEach(date=>{
 S.hlog[date]=(S.hlog[date]||[]).map(x=>{
  if(typeof x==='number')return S.hab[x]?.id;
  return x;
 }).filter(Boolean);
});
/* MIGRATE OLD FINANCE EXPENSES */
S.exp=S.exp.map(e=>({
 ...e,id:e.id||uid(),type:e.type||'expense',
 amt:Number(e.amt)||0,date:e.date||today(),
 cat:e.cat||'Others'
}));
S.exp=S.exp.filter(e=>e.amt>=0);

function save(){
 try{localStorage.setItem(KEY,JSON.stringify(S));return true}
 catch(e){alert('Storage penuh. Export backup dan cuba lagi.');return false}
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm=n=>'RM '+(Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=d=>d?d.split('-').reverse().join('/'):'';
const sum=(a,k)=>a.reduce((v,x)=>v+(Number(x[k])||0),0);
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const month=()=>today().slice(0,7);
let tab='home',filter='All',search='',financeFilter='all',financeSearch='',financeMonth=month();
if(S.set.theme!=='auto')document.documentElement.dataset.theme=S.set.theme;

/* MODAL */
function closeModal(){$('#modal').classList.remove('show');$('#modal').innerHTML=''}
function openModal(title,fields,onSave){
 const m=$('#modal');
 m.innerHTML=`<div class="modal-box">
 <div class="modal-head"><h3>${esc(title)}</h3><button class="modal-close" id="closeModal">✕</button></div>
 <form id="editForm">
 ${fields.map(f=>`<label>${esc(f.label)}
 ${f.type==='textarea'?`<textarea name="${f.key}" rows="4">${esc(f.value??'')}</textarea>`:
 f.type==='select'?`<select name="${f.key}">${f.options.map(o=>`<option value="${esc(o)}" ${o===f.value?'selected':''}>${esc(o)}</option>`).join('')}</select>`:
 `<input name="${f.key}" type="${f.type||'text'}" value="${esc(f.value??'')}" ${f.type==='number'?'step="any" inputmode="decimal"':''} ${f.required?'required':''}>`}
 </label>`).join('')}
 <button class="btn" type="submit">Save changes</button><button class="btn secondary" type="button" id="cancelModal">Cancel</button>
 </form></div>`;
 m.classList.add('show');
 $('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;
 m.onclick=e=>{if(e.target===m)closeModal()};
 $('#editForm').onsubmit=e=>{
  e.preventDefault();const data=Object.fromEntries(new FormData(e.target));
  for(const f of fields){
   if(f.required&&!String(data[f.key]||'').trim()){alert(f.label+' is required.');return}
   if(f.type==='number'&&data[f.key]!==''&&(!Number.isFinite(Number(data[f.key]))||Number(data[f.key])<0)){alert('Please enter a valid number.');return}
  }
  onSave(data);save();closeModal();render();
 };
}
function removeItem(collection,id){
 if(!confirm('Delete this item?'))return;
 S[collection]=S[collection].filter(x=>x.id!==id);save();render();
}
function toggle(collection,id,key){
 const item=S[collection].find(x=>x.id===id);if(!item)return;
 item[key]=!item[key];save();render();
}
function progress(v,max){
 const pct=max?Math.min(100,v/max*100):0;
 return `<div class="bar"><i style="width:${pct}%"></i></div>`;
}
function empty(icon,message){return `<div class="empty"><div style="font-size:35px">${icon}</div>${message}</div>`}

/* PLANNER */
function taskForm(id=null){
 const r=S.tasks.find(x=>x.id===id)||{};
 openModal(id?'Edit task':'New task',[
 {key:'title',label:'Task title',value:r.title,required:true},
 {key:'note',label:'Description',value:r.note},
 {key:'due',label:'Due date',type:'date',value:r.due||today()},
 {key:'time',label:'Time',type:'time',value:r.time},
 {key:'pri',label:'Priority',type:'select',options:['High','Medium','Low'],value:r.pri||'Medium'},
 {key:'tag',label:'Category',value:r.tag},
 {key:'rep',label:'Repeat',type:'select',options:['None','Daily','Weekly','Monthly'],value:r.rep||'None'}
 ],v=>{if(id)Object.assign(r,v);else S.tasks.push({id:uid(),...v,done:false})});
}
function toggleTask(id){
 const t=S.tasks.find(x=>x.id===id);if(!t)return;
 if(!t.done&&t.rep&&t.rep!=='None'){
  const d=t.due||today();
  t.due=t.rep==='Daily'?addDays(d,1):t.rep==='Weekly'?addDays(d,7):addDays(d,30);
 }else t.done=!t.done;
 save();render();
}
function taskHTML(t){
 return `<div class="row ${t.done?'done':''}">
 <button class="chk ${t.done?'done':''}" data-action="task-toggle" data-id="${t.id}">${t.done?'✓':''}</button>
 <div class="content"><div class="task-title"><b>${esc(t.title)}</b></div>
 <div class="mu">${fd(t.due)} ${esc(t.time||'')} · ${esc(t.pri||'Medium')} ${t.tag?'· '+esc(t.tag):''}</div>
 ${t.note?`<div class="mu">${esc(t.note)}</div>`:''}</div>
 <button class="small-btn blue" data-action="task-edit" data-id="${t.id}">Edit</button>
 <button class="small-btn red" data-action="task-delete" data-id="${t.id}">✕</button></div>`;
}
function planner(){
 const d=today(),active=S.tasks.filter(t=>!t.done);
 const overdue=active.filter(t=>t.due&&t.due<d),current=active.filter(t=>t.due===d);
 const upcoming=active.filter(t=>!t.due||t.due>d),completed=S.tasks.filter(t=>t.done);
 const section=(title,arr)=>`<h2>${title}</h2><div class="card">${arr.length?arr.map(taskHTML).join(''):'<div class="mu">Nothing here.</div>'}</div>`;
 return `<h1>Planner</h1><div class="mu">Organise your day, one task at a time.</div>
 <button class="btn" data-action="task-add">＋ Add new task</button>
 ${section('🔴 Overdue',overdue)}${section('📅 Today',current)}${section('⏭ Upcoming',upcoming)}${section('✓ Completed',completed)}`;
}

/* FINANCE */
const CATS=['Food & Drinks','Groceries','Transportation','Shopping','Household','Utilities & Bills','Healthcare','Entertainment','Family','Housing','Commitments','Education','Others'];
const PAY=['Cash','Debit Card','Credit Card','Online Banking','E-wallet'];
const INCOME_CATS=['Salary','Freelance','Business','Bonus','Allowance','Refund','Investment','Others'];
const catIcon=c=>({'Food & Drinks':'🍜','Groceries':'🛒','Transportation':'🚗','Shopping':'🛍️','Household':'🏠','Utilities & Bills':'💡','Healthcare':'💊','Entertainment':'🎬','Family':'👨‍👩‍👧','Housing':'🏡','Commitments':'📑','Education':'📚','Salary':'💰','Freelance':'💻','Business':'💼','Bonus':'🎁','Allowance':'💵','Refund':'↩️','Investment':'📈','Others':'📌'})[c]||'📌';

function financeForm(id=null,defaultType='expense'){
 const r=S.exp.find(x=>x.id===id)||{};
 const type=r.type||defaultType;
 const categories=type==='income'?INCOME_CATS:CATS;
 openModal(id?'Edit transaction':type==='income'?'Add income':'Add expense',[
 {key:'type',label:'Transaction type',type:'select',options:['expense','income'],value:type},
 {key:'amt',label:'Amount (RM)',type:'number',value:r.amt,required:true},
 {key:'desc',label:'Description',value:r.desc,required:true},
 {key:'date',label:'Date',type:'date',value:r.date||today(),required:true},
 {key:'cat',label:'Category',type:'select',options:categories,value:r.cat||(type==='income'?'Salary':CATS[0])},
 {key:'pay',label:'Payment method',type:'select',options:PAY,value:r.pay||PAY[0]},
 {key:'note',label:'Notes',value:r.note}
 ],v=>{
  const item={...v,id:id||uid(),amt:Number(v.amt),type:v.type};
  if(id){const i=S.exp.findIndex(x=>x.id===id);if(i>=0)S.exp[i]=item}
  else S.exp.push(item);
 });
}
function finance(){
 const list=S.exp.filter(e=>e.date?.slice(0,7)===financeMonth);
 const income=Number(S.set.inc)||0;
 const txIncome=sum(list.filter(x=>x.type==='income'),'amt');
 const expense=sum(list.filter(x=>x.type!=='income'),'amt');
 const actualIncome=txIncome+(financeMonth===month()?income:0);
 const balance=actualIncome-expense;
 const budget=Number(S.set.bud)||0;
 const pct=budget?expense/budget*100:0;
 const remaining=budget-expense;
 const categories={};
 list.filter(x=>x.type!=='income').forEach(e=>categories[e.cat||'Others']=(categories[e.cat||'Others']||0)+Number(e.amt));
 const sorted=Object.entries(categories).sort((a,b)=>b[1]-a[1]);
 const colors=['#269b70','#4d8edb','#d99a42','#9b79c9','#db7777','#61aab0','#8b9c70','#cf83a9'];
 const months=[];
 const base=new Date(financeMonth+'-01T12:00:00');
 for(let i=5;i>=0;i--){
  const d=new Date(base.getFullYear(),base.getMonth()-i,1);
  const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const value=sum(S.exp.filter(t=>t.type!=='income'&&t.date?.slice(0,7)===key),'amt');
  months.push({key,label:d.toLocaleDateString('en',{month:'short'}),value});
 }
 const max=Math.max(1,...months.map(x=>x.value));
 const query=financeSearch.toLowerCase();
 const visible=list.filter(t=>(financeFilter==='all'||(financeFilter==='income'?t.type==='income':t.type!=='income'))&&
 (String(t.desc||'')+' '+String(t.cat||'')+' '+String(t.note||'')).toLowerCase().includes(query))
 .sort((a,b)=>b.date.localeCompare(a.date));
 return `
 <div class="finance-heading">
  <div><h1>Finance</h1><div class="mu">Your money, under control.</div></div>
  <input class="finance-month" id="financeMonth" type="month" value="${financeMonth}">
 </div>
 <div class="finance-hero">
  <div class="mu">Monthly balance</div>
  <div class="finance-balance">${rm(balance)}</div>
  <div class="finance-stats">
   <div class="finance-stat"><small>↗ Income</small><strong>${rm(actualIncome)}</strong></div>
   <div class="finance-stat"><small>↘ Expenses</small><strong>${rm(expense)}</strong></div>
  </div>
 </div>
 <div class="grid">
  <div class="card"><div class="mu">Monthly budget</div><div class="big">${budget?rm(budget):'Not set'}</div></div>

function habitDelete(id){
 if(!confirm('Delete this habit? Historical records will remain.'))return;
 S.hab=S.hab.filter(h=>h.id!==id);
 save();render();
}
function habitToggle(id){
 const d=today();S.hlog[d]=S.hlog[d]||[];
 const i=S.hlog[d].indexOf(id);
 if(i>=0)S.hlog[d].splice(i,1);else S.hlog[d].push(id);
 save();render();
}
function habitStreak(id){
 let d=today(),n=0;
 if(!(S.hlog[d]||[]).includes(id))d=addDays(d,-1);
 while((S.hlog[d]||[]).includes(id)&&n<1000){n++;d=addDays(d,-1)}
 return n;
}

}

/* EXPORT / IMPORT */
function download(name,data,type){
 const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importBackup(){
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.onchange=async()=>{
  if(!input.files[0])return;
  try{
   const data=JSON.parse(await input.files[0].text());
   if(!data||!Array.isArray(data.tasks)||!Array.isArray(data.hab)||!data.set||!Array.isArray(data.exp))throw new Error('Invalid backup');
   if(!confirm('Importing will replace current app data. Continue?'))return;
   S=data;S.set={...defaults.set,...(S.set||{})};S.hlog=S.hlog||{};
   S.hab=S.hab.map(h=>typeof h==='string'?{id:uid(),name:h}:h);
   Object.keys(S.hlog).forEach(d=>S.hlog[d]=(S.hlog[d]||[]).map(x=>typeof x==='number'?S.hab[x]?.id:x).filter(Boolean));
   save();go('home');alert('Backup imported successfully!');
  }catch(e){alert('Invalid backup file.')}
 };
 input.click();
}

 case 'shop-clear':if(confirm('Clear all purchased items?')){S.shop=S.shop.filter(x=>!x.got);save();render()}break;
 case 'settings-save':saveSettings();break;
 case 'backup-export':download('mylife-backup.json',JSON.stringify(S,null,2),'application/json');break;
 case 'backup-import':importBackup();break;
 case 'csv-export':{
  const rows=[['Date','Type','Amount','Category','Description','Payment','Notes'],...S.exp.map(x=>[x.date,x.type,x.amt,x.cat,x.desc,x.pay,x.note])];
  download('mylife-finance.csv',rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv;charset=utf-8');break;
 }
 }
});

/* INIT */
save();
render();
</script>
</body>
</html>
