

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="MyLife OS">

<meta name="theme-color" content="#f2f2f7">

<title>MyLife OS</title>

<style>

:root{

--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--mu:#8e8e93;

--ac:#0a84ff;--ok:#30d158;--bad:#ff453a;--wa:#ff9f0a;

--ln:#e5e5ea;color-scheme:light;

}

@media(prefers-color-scheme:dark){

:root:not([data-theme=light]){

--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;

--mu:#98989d;--ln:#2c2c2e;color-scheme:dark;

}}

:root[data-theme=dark]{

--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;

--mu:#98989d;--ln:#2c2c2e;color-scheme:dark;

}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html{scroll-behavior:smooth;scroll-padding-top:20px}

body{

margin:0;padding-top:env(safe-area-inset-top);

padding-bottom:env(safe-area-inset-bottom);

background:var(--bg);color:var(--tx);

font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Arial,sans-serif;

-webkit-text-size-adjust:100%;overscroll-behavior-y:contain;

}

#app{display:flex;min-height:100vh}

nav{

position:fixed;bottom:0;left:0;right:0;

display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);

backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);

border-top:1px solid var(--ln);

padding:7px 0 calc(8px + env(safe-area-inset-bottom));

z-index:20;

}

nav button{

flex:1;border:0;background:none;color:var(--mu);

font-size:11px;padding:7px 4px;min-height:52px;

display:flex;flex-direction:column;align-items:center;

justify-content:center;gap:2px;touch-action:manipulation;

}

nav button span{font-size:22px}

nav button.on{color:var(--ac)}

main{

flex:1;width:100%;max-width:720px;margin:0 auto;

padding:calc(28px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom));

animation:fade .25s;min-width:0;

}

@keyframes fade{from{opacity:0;transform:translateY(6px)}}

h1{font-size:30px;margin:6px 0 2px}

h2{font-size:18px;margin:22px 0 8px}

h3{margin:0 0 10px}

.mu{color:var(--mu);font-size:14px}

.card{

background:var(--card);border-radius:18px;padding:14px;

margin:10px 0;box-shadow:0 1px 8px rgba(0,0,0,.06);

}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.grid .card{margin:0}

.big{font-size:24px;font-weight:700}

.row{

display:flex;align-items:center;gap:8px;

padding:11px 0;border-bottom:1px solid var(--ln);min-width:0;

}

.row:last-child{border:0}

.row>div{flex:1;min-width:0;overflow-wrap:anywhere}

.row button{flex-shrink:0}

.bar{height:8px;background:var(--ln);border-radius:5px;overflow:hidden;margin-top:8px}

.bar i{display:block;height:100%;background:var(--ac);border-radius:5px;transition:width .4s}

.btn,.btn2{

width:100%;border:0;border-radius:14px;padding:15px 14px;

min-height:50px;font-size:16px;font-weight:650;

background:var(--ac);color:white;margin-top:12px;

touch-action:manipulation;cursor:pointer;

}

.btn2{background:var(--ln);color:var(--tx)}

.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.qa button{

border:0;background:var(--card);color:var(--tx);

border-radius:16px;padding:12px 4px;font-size:12px;

box-shadow:0 1px 8px rgba(0,0,0,.06);

}

.qa span{display:block;font-size:22px}

.chk{

width:26px;height:26px;border-radius:50%;

border:2px solid var(--mu);background:none;color:white;

flex:none;font-size:14px;

}

.chk.on{background:var(--ok);border-color:var(--ok)}

.x{

border:0;background:transparent;color:var(--mu);

font-size:15px;min-width:42px;min-height:42px;

padding:8px;border-radius:12px;touch-action:manipulation;

cursor:pointer;

}

.x:active,.btn:active,.btn2:active{opacity:.72;transform:scale(.98)}

.tag{font-size:11px;padding:2px 8px;border-radius:9px;background:var(--ln)}

.H{color:var(--bad)}.M{color:var(--wa)}.L{color:var(--ok)}

.done .t{text-decoration:line-through;color:var(--mu)}

#sheet{

position:fixed;inset:0;background:rgba(0,0,0,.46);

display:none;align-items:flex-end;z-index:50;

padding-top:env(safe-area-inset-top);

}

#sheet.on{display:flex}

.sb{

background:var(--card);width:100%;max-width:720px;

margin:0 auto;border-radius:24px 24px 0 0;

padding:20px 18px calc(24px + env(safe-area-inset-bottom));

max-height:88dvh;overflow:auto;overscroll-behavior:contain;

touch-action:pan-y;

}

.sb h3{font-size:20px}

.sb label:first-of-type{margin-top:16px}

label{display:block;font-size:13px;color:var(--mu);margin-top:14px}

input,select,textarea{

width:100%;min-height:46px;font:inherit;font-size:16px;

padding:12px;border-radius:12px;border:1px solid var(--ln);

background:var(--bg);color:var(--tx);margin-top:4px;

}

.rc{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.rc .card{padding:0;overflow:hidden;margin:0}

.rc img,.ph{

width:100%;height:110px;object-fit:cover;

display:block;background:var(--ln);

text-align:center;line-height:110px;font-size:36px;

}

.rc div{padding:10px}

.rc .card{cursor:pointer;touch-action:manipulation}

.rc .card:active{transform:scale(.985)}

button,select,input,textarea{touch-action:manipulation}

button:focus-visible,input:focus-visible,

select:focus-visible,textarea:focus-visible{

outline:2px solid var(--ac);outline-offset:2px;

}

.seg{display:flex;gap:6px;overflow:auto;margin:8px 0}

.seg button{

border:0;border-radius:16px;padding:6px 12px;

background:var(--card);color:var(--tx);white-space:nowrap;

}

.seg .on{background:var(--ac);color:white}

.warn{background:var(--wa);color:#000;border-radius:14px;padding:10px;margin:10px 0}

/* NEW SETTINGS UI */

.settings-card{

background:var(--card);

padding:16px;

border-radius:18px;

margin:12px 0;

box-shadow:0 1px 8px rgba(0,0,0,.05);

}

.setting-field{margin-bottom:20px}

.setting-field:last-child{margin-bottom:0}

.setting-field label{

color:var(--tx);font-size:14px;

font-weight:650;margin:0 0 8px;

}

.setting-field input{

margin:0;min-height:54px;

font-size:18px;font-weight:650;

border:1.5px solid var(--ln);

background:var(--bg);border-radius:13px;

padding:13px;outline:none;

appearance:none;-webkit-appearance:none;

}

.setting-field input:focus{

border-color:var(--ac);

box-shadow:0 0 0 3px rgba(10,132,255,.12);

}

.setting-description{font-size:12px;color:var(--mu);margin-top:6px}

.settings-save{

width:100%;background:var(--ac);color:white;

border:0;border-radius:14px;padding:15px;

min-height:52px;font-size:16px;font-weight:700;

margin-top:8px;

}

.settings-save:active{opacity:.7}

.settings-select{

width:130px;margin:0;min-height:44px;

font-weight:600;

}

@media(min-width:900px){

nav{

top:0;bottom:auto;right:auto;width:200px;

flex-direction:column;border-top:0;

border-right:1px solid var(--ln);padding:30px 10px;

}

nav button{flex:none;flex-direction:row;font-size:15px;gap:10px;padding:12px}

main{margin-left:230px}

}

</style>

</head>

<body>

<div id="app">

<nav id="nav"></nav>

<main id="main"></main>

</div>

<div id="sheet"></div>

<script>

const K='mylife_os_v1',TZ='Asia/Kuala_Lumpur';

let S={};

try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}

const D={

tasks:[],exp:[],food:[],rec:[],shop:[],

hab:['Drink enough water','Exercise','Walk','Sleep on time','Read','Complete daily priorities'],

hlog:{},

set:{inc:0,bud:0,cal:2000,theme:'auto'}

};

for(const k in D){

 if(S[k]===undefined) S[k]=D[k];

}

if(!S.set)S.set={...D.set};

else S.set={...D.set,...S.set};

const save=()=>{

 try{

  localStorage.setItem(K,JSON.stringify(S));

 }catch(e){

  alert('Storage full. Export your data and remove some recipe photos.');

 }

};

const $=s=>document.querySelector(s);

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({

'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'

}[c]));

const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:TZ});

const fd=d=>d?d.split('-').reverse().join('/'):'';

const rm=n=>'RM '+(+n||0).toFixed(2);

const addDays=(d,n)=>{

 const x=new Date(d+'T00:00:00Z');

 x.setUTCDate(x.getUTCDate()+n);

 return x.toISOString().slice(0,10);

};

const addMonth=d=>{

 const x=new Date(d+'T00:00:00Z');

 x.setUTCMonth(x.getUTCMonth()+1);

 return x.toISOString().slice(0,10);

};

let tab='home',sub=null,q='',cat='All';

if(S.set.theme!=='auto')

 document.documentElement.dataset.theme=S.set.theme;

function form(title,fs,cb){

 const sh=$('#sheet');

 sh.innerHTML=`

 <div class="sb">

 <h3>${title}</h3>

 ${fs.map(f=>`

 <label>${f.l}

 ${f.t==='select'

 ?`<select id="f_${f.k}">${f.o.map(o=>`<option ${o===f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`

 :f.t==='textarea'

 ?`<textarea id="f_${f.k}" rows="4">${esc(f.v)}</textarea>`

 :`<input id="f_${f.k}" type="${f.t||'text'}"

 ${f.t==='file'?'accept="image/*"':''}

 ${f.t==='number'?'step="any" inputmode="decimal"':''}

 value="${f.t==='file'?'':esc(f.v)}">`

 }

 </label>`).join('')}

 <button class="btn" id="ok">Save</button>

 <button class="btn2" id="no">Cancel</button>

 </div>`;

 sh.classList.add('on');

 $('#no').onclick=()=>sh.classList.remove('on');

 sh.onclick=e=>{

  if(e.target===sh)sh.classList.remove('on');

 };

 $('#ok').onclick=async()=>{

  const v={};

  for(const f of fs){

   const el=$('#f_'+f.k);

   if(f.t==='file')

    v[f.k]=el.files[0]?await img(el.files[0]):f.v||'';

   else

    v[f.k]=el.value.trim();

   if(f.req&&!v[f.k]){

    el.style.borderColor='var(--bad)';

    el.focus();

    return;

   }

   if(f.t==='number'&&v[f.k]!==''&&

      (isNaN(v[f.k])||+v[f.k]<0)){

    el.style.borderColor='var(--bad)';

    return;

   }

  }

  sh.classList.remove('on');

  cb(v);

  save();

  R();

 };

}

const img=f=>new Promise(resolve=>{

 const i=new Image();

 const u=URL.createObjectURL(f);

 i.onload=()=>{

  const s=Math.min(1,600/i.width);

  const c=document.createElement('canvas');

  c.width=i.width*s;

  c.height=i.height*s;

  c.getContext('2d').drawImage(i,0,0,c.width,c.height);

  URL.revokeObjectURL(u);

  resolve(c.toDataURL('image/jpeg',.7));

 };

 i.onerror=()=>{

  URL.revokeObjectURL(u);

  resolve('');

 };

 i.src=u;

});

const CATS=[

'Food & Drinks','Groceries','Petrol & Transportation',

'Shopping','Household','Utilities & Bills',

'Healthcare','Entertainment','Family','Others'

];

const PAY=['Cash','Debit Card','Credit Card','Online Banking','E-wallet'];

const MEAL=['Breakfast','Lunch','Dinner','Snacks'];

const mon=()=>today().slice(0,7);

const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);

// TASKS

const addTask=()=>form('Add Task',[

{k:'title',l:'Title',req:1},

{k:'note',l:'Description'},

{k:'due',l:'Due date',t:'date',v:today()},

{k:'time',l:'Time',t:'time'},

{k:'pri',l:'Priority',t:'select',o:['High','Medium','Low'],v:'Medium'},

{k:'tag',l:'Category / tag'},

{k:'rep',l:'Repeat',t:'select',o:['None','Daily','Weekly','Monthly'],v:'None'}

],v=>S.tasks.push({id:uid(),...v,done:0}));

const editTask=id=>{

 const r=S.tasks.find(x=>x.id==id);

 if(!r)return;

 form('Edit Task',[

 {k:'title',l:'Title',req:1,v:r.title},

 {k:'note',l:'Description',v:r.note},

 {k:'due',l:'Due date',t:'date',v:r.due},

 {k:'time',l:'Time',t:'time',v:r.time},

 {k:'pri',l:'Priority',t:'select',o:['High','Medium','Low'],v:r.pri||'Medium'},

 {k:'tag',l:'Category / tag',v:r.tag},

 {k:'rep',l:'Repeat',t:'select',o:['None','Daily','Weekly','Monthly'],v:r.rep||'None'}

 ],v=>Object.assign(r,v));

};

// FINANCE

const addExp=()=>form('Add Expense',[

{k:'amt',l:'Amount (RM)',t:'number',req:1},

{k:'desc',l:'Description'},

{k:'date',l:'Date',t:'date',v:today()},

{k:'cat',l:'Category',t:'select',o:CATS,v:CATS[0]},

{k:'pay',l:'Payment method',t:'select',o:PAY,v:PAY[0]},

{k:'note',l:'Notes'}

],v=>S.exp.push({id:uid(),...v}));

const editExp=id=>{

 const r=S.exp.find(x=>x.id==id);

 if(!r)return;

 form('Edit Expense',[

 {k:'amt',l:'Amount (RM)',t:'number',req:1,v:r.amt},

 {k:'desc',l:'Description',v:r.desc},

 {k:'date',l:'Date',t:'date',v:r.date},

 {k:'cat',l:'Category',t:'select',o:CATS,v:r.cat},

 {k:'pay',l:'Payment method',t:'select',o:PAY,v:r.pay},

 {k:'note',l:'Notes',v:r.note}

 ],v=>Object.assign(r,v));

};

// HEALTH

const addFood=()=>form('Log Food',[

{k:'meal',l:'Meal',t:'select',o:MEAL,v:'Breakfast'},

{k:'name',l:'Food name',req:1},

{k:'qty',l:'Quantity / serving'},

{k:'kcal',l:'Calories (estimate)',t:'number',req:1},

{k:'p',l:'Protein (g)',t:'number'},

{k:'c',l:'Carbs (g)',t:'number'},

{k:'f',l:'Fat (g)',t:'number'}

],v=>S.food.push({id:uid(),date:today(),...v}));

const editFood=id=>{

 const r=S.food.find(x=>x.id==id);

 if(!r)return;

 form('Edit Food Log',[

 {k:'meal',l:'Meal',t:'select',o:MEAL,v:r.meal},

 {k:'name',l:'Food name',req:1,v:r.name},

 {k:'qty',l:'Quantity / serving',v:r.qty},

 {k:'kcal',l:'Calories (estimate)',t:'number',req:1,v:r.kcal},

 {k:'p',l:'Protein (g)',t:'number',v:r.p},

 {k:'c',l:'Carbs (g)',t:'number',v:r.c},

 {k:'f',l:'Fat (g)',t:'number',v:r.f}

 ],v=>Object.assign(r,v));

};

// SHOPPING

const addShop=()=>form('Add item to buy',[

{k:'name',l:'Item to buy',req:1},

{k:'note',l:'Notes / quantity'}

],v=>S.shop.push({id:uid(),name:v.name,note:v.note,got:0}));

const editShop=id=>{

 const r=S.shop.find(x=>x.id==id);

 if(!r)return;

 form('Edit item to buy',[

 {k:'name',l:'Item to buy',req:1,v:r.name},

 {k:'note',l:'Notes / quantity',v:r.note}

 ],v=>Object.assign(r,{name:v.name,note:v.note}));

};

// RECIPES

const addRec=(r={})=>form(r.id?'Edit Recipe':'Add Recipe',[

{k:'name',l:'Recipe name',req:1,v:r.name},

{k:'photo',l:'Food photo',t:'file',v:r.photo},

{k:'cat',l:'Category',t:'select',o:['Rice','Noodles','Curry','Soup','Snack','Dessert','Drinks','Other'],v:r.cat||'Rice'},

{k:'prep',l:'Prep time (min)',t:'number',v:r.prep},

{k:'cook',l:'Cook time (min)',t:'number',v:r.cook},

{k:'srv',l:'Servings',t:'number',v:r.srv},

{k:'ing',l:'Ingredients (one per line, with quantity)',t:'textarea',v:r.ing},

{k:'steps',l:'Steps (one per line)',t:'textarea',v:r.steps},

{k:'notes',l:'Personal notes',t:'textarea',v:r.notes}

],v=>{

 if(r.id)Object.assign(S.rec.find(x=>x.id==r.id),v);

 else S.rec.push({id:uid(),fav:0,...v});

});

const tg=(a,id,k)=>{

 const x=S[a].find(x=>x.id==id);

 if(!x)return;

 x[k]=x[k]?0:1;

 save();

 R();

};

const del=(a,id)=>{

 if(confirm('Delete this item?')){

  S[a]=S[a].filter(x=>x.id!=id);

  save();

  R();

 }

};

const chkTask=id=>{

 const t=S.tasks.find(x=>x.id==id);

 if(!t)return;

 if(!t.done&&t.rep&&t.rep!=='None'){

  t.due=t.rep==='Daily'?addDays(t.due||today(),1):

        t.rep==='Weekly'?addDays(t.due||today(),7):

        addMonth(t.due||today());

 }else{

  t.done=t.done?0:1;

 }

 save();

 R();

};

const hab=i=>{

 const d=today();

 S.hlog[d]=S.hlog[d]||[];

 const a=S.hlog[d];

 const j=a.indexOf(i);

 j<0?a.push(i):a.splice(j,1);

 save();

 R();

};

const streak=i=>{

 let n=0,d=today();

 if(!(S.hlog[d]||[]).includes(i))d=addDays(d,-1);

 while((S.hlog[d]||[]).includes(i)){

  n++;

  d=addDays(d,-1);

 }

 return n;

};

const go=(t,s)=>{

 tab=t;

 sub=s||null;

 q='';

 cat='All';

 R();

 window.scrollTo({top:0,behavior:'instant'});

};

function dl(name,txt,type){

 const a=document.createElement('a');

 const u=URL.createObjectURL(new Blob([txt],{type}));

 a.href=u;

 a.download=name;

 a.click();

 setTimeout(()=>URL.revokeObjectURL(u),1000);

}

const csv=()=>dl(

 'expenses.csv',

 'Date,Amount,Category,Description,Payment,Notes\n'+

 S.exp.map(e=>[fd(e.date),e.amt,e.cat,e.desc,e.pay,e.note]

 .map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),

 'text/csv'

);

const impt=()=>{

 const i=document.createElement('input');

 i.type='file';

 i.accept='.json';

 i.onchange=async()=>{

  try{

   const d=JSON.parse(await i.files[0].text());

   if(!d.tasks||!d.set)throw 0;

   if(!confirm('Import backup? This will replace current app data.'))return;

   S={...D,...d,set:{...D.set,...d.set}};

   save();

   R();

  }catch(e){

   alert('That file is not a valid MyLife OS backup.');

  }

 };

 i.click();

};

// NEW SETTINGS SAVE FUNCTION

function saveSettings(){

 const income=document.getElementById('setting-income');

 const budget=document.getElementById('setting-budget');

 const calorie=document.getElementById('setting-cal');

 const theme=document.getElementById('setting-theme');

 const validate=(el,min=0)=>{

  if(!el)return true;

  const n=Number(el.value);

  if(el.value.trim()===''||!Number.isFinite(n)||n<min){

   el.style.borderColor='var(--bad)';

   el.focus();

   return false;

  }

  el.style.borderColor='var(--ln)';

  return true;

 };

 if(!validate(income)||

    !validate(budget)||

    !validate(calorie,1)){

  alert('Please enter valid values.');

  return;

 }

 S.set.inc=Number(income.value);

 S.set.bud=Number(budget.value);

 S.set.cal=Number(calorie.value);

 if(theme)S.set.theme=theme.value;

 document.documentElement.dataset.theme=

 S.set.theme==='auto'?'':S.set.theme;

 save();

 R();

 alert('Settings saved successfully!');

}

// COMMON COMPONENTS

const tRow=t=>`

<div class="row ${t.done?'done':''}">

<button class="chk ${t.done?'on':''}" onclick="chkTask('${t.id}')">${t.done?'✓':''}</button>

<div>

 <div class="t">${esc(t.title)}</div>

 <div class="mu">

 ${fd(t.due)} ${esc(t.time)}

 <span class="${(t.pri||'Medium')[0]}">● ${esc(t.pri||'Medium')}</span>

 ${t.tag?`<span class="tag">${esc(t.tag)}</span>`:''}

 ${t.rep&&t.rep!=='None'?'↻':''}

 </div>

</div>

<button class="x" aria-label="Edit task" onclick="editTask('${t.id}')">Edit</button>

<button class="x" aria-label="Delete task" onclick="del('tasks','${t.id}')">✕</button>

</div>`;

const empty=(i,t)=>`

<div class="card" style="text-align:center;color:var(--mu)">

<div style="font-size:34px">${i}</div>${t}

</div>`;

const bar=(v,m,c)=>`

<div class="bar">

<i style="width:${Math.min(100,m?v/m*100:0)}%;${c?'background:'+c:''}"></i>

</div>`;

// MAIN VIEWS

const V={

home(){

 const d=today();

 const tt=S.tasks.filter(t=>t.due===d||(t.due<d&&!t.done));

 const dn=tt.filter(t=>t.done).length;

 const sp=sum(S.exp.filter(e=>e.date===d),'amt');

 const ms=sum(S.exp.filter(e=>e.date.startsWith(mon())),'amt');

 const cal=sum(S.food.filter(f=>f.date===d),'kcal');

// RECIPE DETAIL

function viewRec(id){

 const r=S.rec.find(x=>x.id==id);

 if(!r)return;

 const sh=$('#sheet');

 const L=t=>(t||'').split('\n').filter(Boolean);

 sh.innerHTML=`

 <div class="sb">

 ${r.photo?`<img src="${r.photo}" style="width:100%;border-radius:14px;max-height:240px;object-fit:cover" alt="">`:''}

 <h3 style="margin-top:10px">${esc(r.name)}</h3>

 <div class="mu">

 Prep ${r.prep||0} min · Cook ${r.cook||0} min ·

 ${r.srv||'?'} servings · ${esc(r.cat)}

 </div>

 <h2>Ingredients</h2>

 <ul>${L(r.ing).map(i=>`<li>${esc(i)}</li>`).join('')}</ul>

 <h2>Steps</h2>

 <ol>${L(r.steps).map(i=>`<li>${esc(i)}</li>`).join('')}</ol>

 ${r.notes?`<h2>Notes</h2><p>${esc(r.notes)}</p>`:''}

 <button class="btn" id="fv">${r.fav?'♥ Unfavourite':'♡ Favourite'}</button>

 <button class="btn2" id="ed">Edit Recipe</button>

 <button class="btn2" id="dl" style="color:var(--bad)">Delete</button>

 <button class="btn2" id="cl">Close</button>

 </div>`;

 sh.classList.add('on');

 sh.onclick=e=>{

  if(e.target===sh)sh.classList.remove('on');

 };

 $('#cl').onclick=()=>sh.classList.remove('on');

 $('#fv').onclick=()=>{

  sh.classList.remove('on');

  tg('rec',id,'fav');

 };

 $('#ed').onclick=()=>{

  sh.classList.remove('on');

  addRec(r);

 };

 $('#dl').onclick=()=>{

  sh.classList.remove('on');

  del('rec',id);

 };

}

function R(keep){

 const pos=keep&&$('#srch')?$('#srch').selectionStart:0;

 $('#main').innerHTML=V[tab]();

 $('#nav').innerHTML=[

 ['home','🏠','Home'],

 ['plan','🗓️','Planner'],

 ['fin','💰','Finance'],

 ['health','🥗','Health'],

 ].map(n=>`

 <button class="${tab===n[0]?'on':''}" onclick="go('${n[0]}')">

 <span>${n[1]}</span>${n[2]}

 </button>

 `).join('');

 if(keep&&$('#srch')){

  $('#srch').focus();

  $('#srch').setSelectionRange(pos,pos);

 }

}

R();
